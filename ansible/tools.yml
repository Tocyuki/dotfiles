---
- name: Get git repository root
  command: git rev-parse --show-toplevel
  args:
    chdir: "{{ playbook_dir }}"
  register: git_root
  changed_when: false
  tags:
    - always

- name: install aqua
  homebrew:
    name: aqua
    state: present
    update_homebrew: true
  tags:
    - tools

- name: create directory
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "~/.config/aqua"
    - "~/.config/git"
    - "~/.config/lazygit"
    - "~/.config/ecsta"
    - "~/.claude"
  tags:
    - dotfiles
    - tools

- name: link dotfiles
  file:
    src: "{{ git_root.stdout }}/{{ item.file }}"
    dest: "{{ item.dest }}"
    state: link
    force: yes
  loop:
    - { file: "aqua.yaml", dest: "~/.config/aqua/aqua.yaml" }
    - { file: ".config/lazygit/config.yml", dest: "~/.config/lazygit/config.yml" }
    - { file: ".config/git/ignore", dest: "~/.config/git/ignore" }
    - { file: ".config/ecsta/config.json", dest: "~/.config/ecsta/config.json" }
    - { file: ".claude/settings.json", dest: "~/.claude/settings.json" }
    - { file: ".gitconfig", dest: "~/.gitconfig" }
    - { file: ".gitconfig-studypocket", dest: "~/.gitconfig-studypocket" }
  tags:
    - dotfiles
    - tools

# 自己アップデートするため brew ではなく公式インストーラーで入れる (PATH は .zshrc の grok installer ブロック)
- name: install grok cli via official installer
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://x.ai/cli/install.sh | bash
  args:
    executable: /bin/bash
    creates: ~/.grok/bin/grok
  tags:
    - tools

# .zshrc が BUN_INSTALL=~/.bun を前提にしているため公式インストーラーで入れる (更新は bun upgrade)
- name: install bun via official installer
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://bun.sh/install | bash
  args:
    executable: /bin/bash
    creates: ~/.bun/bin/bun
  tags:
    - tools

# brew/aqua 未提供のため公式インストーラーで入れる (~/.local/bin に入り .zshrc で PATH 済み。更新は再実行)
- name: install gwscli via official installer
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://dl.google.com/workspace-cli/install.sh | bash
  args:
    executable: /bin/bash
    creates: ~/.local/bin/gwscli
  tags:
    - tools

- name: aqua - install tools
  ansible.builtin.command: aqua i -l
  args:
    chdir: "{{ git_root.stdout }}/"
  tags:
    - tools

- name: aqua - list global tools
  ansible.builtin.command: aqua list -i
  register: aqua_tools
  changed_when: false
  tags:
    - tools

- name: show aqua tools list
  ansible.builtin.debug:
    msg: "{{ aqua_tools.stdout_lines }}"
  tags:
    - tools

